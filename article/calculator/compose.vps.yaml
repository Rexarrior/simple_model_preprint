services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.vps
    ports:
      - "127.0.0.1:3002:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: ./vps/backend
    ports:
      - "127.0.0.1:3003:8000"
    volumes:
      - m4-data:/data
    environment:
      DB_PATH: /data/shared-calculations.sqlite3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  m4-data:
